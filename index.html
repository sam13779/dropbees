<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DROPBEES – We Pick. We Drop. We Deliver.</title>
<meta name="description" content="DROPBEES is a subscription-based hyperlocal pickup and drop delivery service in Navi Mumbai.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--y:#FFC928;--k:#171717;--l:#FFF9E8;--t:#2B2B2B;--m:#6b6558;--line:#eadfbf}
*{box-sizing:border-box}
body{margin:0;font-family:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--t);background:#fff;line-height:1.5}
a{color:inherit}
:focus-visible{outline:3px solid var(--k);outline-offset:2px}
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 20px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:22px;text-decoration:none;color:var(--k)}
.logo svg{width:32px;height:auto;display:block;flex:none}
.logo{line-height:1}
nav{display:flex;gap:2px;flex:1;justify-content:center}
nav a{padding:8px 12px;border-radius:99px;text-decoration:none;font-weight:600;font-size:14px}
nav a.on,nav a:hover{background:var(--l)}
#burger{display:none;background:none;border:0;font-size:26px;cursor:pointer;padding:0 6px}
.btn{display:inline-block;border:0;border-radius:12px;padding:12px 22px;background:var(--y);color:var(--k);font:700 15px 'Poppins',sans-serif;cursor:pointer;text-decoration:none;text-align:center}
.btn:hover{filter:brightness(.95)}.btn.dark{background:var(--k);color:var(--y)}.btn.line{background:none;border:2px solid var(--k)}.btn.sm{padding:8px 16px;font-size:13px}.btn[disabled]{opacity:.45;cursor:not-allowed}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}.narrow{max-width:720px}
.sec{padding:48px 0}.alt{background:var(--l)}
h1{font-size:clamp(30px,5vw,52px);line-height:1.1;margin:12px 0}h2{font-size:clamp(24px,3.5vw,34px);margin:0 0 8px}h3{margin:6px 0}
.lead{font-size:18px;color:var(--m);margin:8px 0}.muted{color:var(--m);font-size:14px}
.tag{display:inline-block;background:var(--k);color:var(--y);padding:6px 14px;border-radius:99px;font-weight:700;font-size:13px}
.hgrid{display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center;padding:48px 20px}
.art svg{width:100%;height:auto;animation:bob 3.2s ease-in-out infinite}
.art img{width:100%;height:auto;display:block;border-radius:28px;animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.between{justify-content:space-between}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px;margin-top:18px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px}
.num{display:inline-flex;width:34px;height:34px;border-radius:50%;background:var(--y);align-items:center;justify-content:center;font-weight:800}
.price{font-size:32px;font-weight:800}.ul{padding-left:18px;margin:8px 0}.ul li{margin:4px 0}
.st{display:inline-block;padding:3px 12px;border-radius:99px;background:var(--y);font-weight:700;font-size:12px}.st.bad{background:#f3c9c4}.st.ok{background:#cfeccd}
.f{display:grid;gap:14px}.f label{font-weight:600;font-size:13px;display:grid;gap:4px}
.f input,.f select,.f textarea{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:12px;font:inherit;background:#fff}
.f input[type=checkbox],.f input[type=radio]{width:auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.seg{display:flex;gap:10px;flex-wrap:wrap}.seg label{display:flex;flex-direction:row;gap:6px;align-items:center;padding:8px 12px;border:1.5px solid var(--line);border-radius:12px}
.chk{display:flex!important;flex-direction:row!important;gap:8px;align-items:flex-start;font-weight:600}
.err{color:#b3261e;font-weight:600;min-height:18px;margin:0}
.est{background:var(--l);border-radius:14px;padding:14px 16px;display:grid;gap:6px}
.tl{list-style:none;padding:0;margin:12px 0}.tl li{position:relative;padding:4px 0 10px 28px;color:var(--m);font-size:14px}
.tl li::before{content:"";position:absolute;left:4px;top:8px;width:12px;height:12px;border-radius:50%;background:var(--line)}
.tl li::after{content:"";position:absolute;left:9px;top:22px;bottom:-4px;width:2px;background:var(--line)}.tl li:last-child::after{display:none}
.tl li.done{color:var(--t)}.tl li.done::before{background:var(--y);box-shadow:0 0 0 2px var(--k)}.tl small{display:block;color:var(--m)}
.otp{background:var(--k);color:var(--y);border-radius:14px;padding:12px 16px}.otp b{font-size:28px;letter-spacing:4px;margin-left:8px}.otp small{display:block;color:#ddd}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--y)}
details{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin:10px 0}summary{font-weight:700;cursor:pointer}
footer{background:var(--k);color:#ddd;padding:32px 0;margin-top:40px}footer a{color:var(--y)}.fl{display:flex;gap:16px;flex-wrap:wrap;margin:10px 0}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--k);color:#fff;padding:12px 18px;border-radius:12px;z-index:50;max-width:90%;text-align:center}
#toast[hidden]{display:none}
@media(max-width:820px){
  .hgrid{grid-template-columns:1fr}.two{grid-template-columns:1fr}
  nav{display:none;position:absolute;top:100%;left:0;right:0;background:#fff;flex-direction:column;padding:10px;border-bottom:1px solid var(--line)}
  nav.open{display:flex}#burger{display:block}.top .btn.sm{margin-left:auto}
}
@media(prefers-reduced-motion:reduce){.art svg,.art img{animation:none}}

/* ===== Enhancements: logo, animations, loading screen ===== */
.flogo{display:inline-flex;align-items:center;gap:8px}
html{scroll-behavior:smooth}

/* Loading screen */
#loader{position:fixed;inset:0;z-index:200;background:#FFC928;display:flex;align-items:center;justify-content:center;transition:opacity .6s ease,visibility .6s}
#loader.hide{opacity:0;visibility:hidden;pointer-events:none}
.ld-inner{display:grid;justify-items:center;gap:12px;text-align:center;animation:ldIn .7s cubic-bezier(.22,.61,.36,1) both}
@keyframes ldIn{from{opacity:0;transform:translateY(18px) scale(.96)}to{opacity:1;transform:none}}
.ld-logo{width:84px;height:auto;display:block;animation:ldBob 2.6s ease-in-out infinite}
@keyframes ldBob{50%{transform:translateY(-9px)}}
.ld-fly{animation:ldFly 2.8s ease-in-out infinite}
@keyframes ldFly{0%,100%{transform:translateX(-52px)}50%{transform:translateX(52px)}}
.ld-bee{width:34px;height:auto;display:block}
.ld-wing{transform-origin:20px 12px;animation:ldFlap .32s ease-in-out infinite alternate}
@keyframes ldFlap{from{transform:scaleY(1)}to{transform:scaleY(.5)}}
.ld-name{font-weight:800;font-size:27px;letter-spacing:7px;color:#171717;margin-top:2px}
.ld-tag{font-weight:600;font-size:13px;color:#4d4527;letter-spacing:.4px}
.ld-bar{width:150px;height:4px;border-radius:99px;background:rgba(23,23,23,.18);overflow:hidden;margin-top:8px}
.ld-bar i{display:block;height:100%;width:38%;border-radius:99px;background:#171717;animation:ldSlide 1.1s ease-in-out infinite}
@keyframes ldSlide{0%{transform:translateX(-110%)}100%{transform:translateX(420%)}}

/* Entrance animations */
.reveal{opacity:0;transform:translateY(22px);transition:opacity .65s cubic-bezier(.22,.61,.36,1),transform .65s cubic-bezier(.22,.61,.36,1)}
.reveal.in{opacity:1;transform:none}
.d0{transition-delay:0s}.d1{transition-delay:.09s}.d2{transition-delay:.18s}
@keyframes heroIn{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
.art{animation:heroIn .9s cubic-bezier(.22,.61,.36,1) .1s both}
@media(max-width:820px){.ld-name{letter-spacing:4px;font-size:22px}}

/* Micro-interactions (declared after .reveal so hover states win) */
.btn{transition:transform .18s ease,box-shadow .18s ease,filter .18s ease}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(23,23,23,.14)}
.btn:active{transform:translateY(0);box-shadow:0 2px 5px rgba(23,23,23,.18)}
.btn[disabled],.btn[disabled]:hover{transform:none;box-shadow:none}
nav a{transition:background .2s ease,transform .2s ease}
nav a:hover{transform:translateY(-1px)}
.card{transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease,opacity .65s cubic-bezier(.22,.61,.36,1)}
.card:hover{transform:translateY(-4px);box-shadow:0 12px 26px rgba(23,23,23,.10);border-color:#dcc98c}
details{transition:box-shadow .2s ease,border-color .2s ease,opacity .65s cubic-bezier(.22,.61,.36,1)}
summary{transition:color .2s ease}
details:hover{box-shadow:0 6px 16px rgba(23,23,23,.07)}
a{transition:color .2s ease}
#toast{transition:opacity .3s ease,transform .3s ease}

@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .reveal{opacity:1;transform:none;transition:none}
  .art,.ld-logo,.ld-fly,.ld-wing,.ld-bar i,.ld-inner{animation:none}
  .btn,nav a,.card,details,a{transition:none}
  .btn:hover,.card:hover,nav a:hover{transform:none;box-shadow:none}
}
</style>
</head>

const PG={
home:()=>{
 const sv=CFG.services.filter(s=>s.active),pl=CFG.plans.filter(p=>p.active);
 return `<section class="alt"><div class="wrap hgrid"><div><span class="tag">We Pick. We Drop. We Deliver.</span><h1>Your Everyday Pickup &amp; Drop Partner</h1><p class="lead">One Subscription. Multiple Deliveries. Zero Hassle.</p><p class="muted">Hyperlocal delivery in Navi Mumbai.</p><div class="row" style="margin-top:14px"><a class="btn" href="#/book">Book a Delivery</a><a class="btn line" href="#/plans">Explore Plans</a></div></div><div class="art">${ART}</div></div></section>
<section class="sec"><div class="wrap"><h2>How DropBees works</h2><div class="grid">${[['1','Book online','Enter pickup, drop and parcel details.'],['2','We pick up','A rider collects the parcel from the pickup address.'],['3','We deliver','Your parcel is dropped at the receiver.'],['4','Confirm with OTP','The receiver shares a 3-digit OTP to confirm delivery.']].map(x=>`<div class="card"><span class="num">${x[0]}</span><h3>${x[1]}</h3><p class="muted">${x[2]}</p></div>`).join('')}</div></div></section>
<section class="sec alt"><div class="wrap"><h2>Our Delivery Services</h2><div class="grid">${sv.map(s=>`<div class="card"><h3>${esc(s.name)}</h3><p class="muted">${esc(s.desc)}</p><ul class="ul">${s.items.slice(0,4).map(i=>`<li>${esc(i)}</li>`).join('')}</ul><a class="btn sm" href="#/book?cat=${esc(s.id)}">Book now</a></div>`).join('')}</div><p><a href="#/services"><b>See all services →</b></a></p></div></section>
<section class="sec"><div class="wrap"><h2>Subscription Plans</h2><p class="muted">One subscription, many deliveries. Each delivery within plan limits uses 1 credit.</p><div class="grid">${pl.map(p=>`<div class="card"><h3>${esc(p.name)}</h3><div class="price">${money(p.priceM)}<small class="muted"> / month</small></div><p><b>${p.credits}</b> delivery credits per month</p></div>`).join('')}</div><p><a href="#/plans"><b>Compare plans →</b></a></p></div></section>
<section class="sec alt"><div class="wrap"><h2>Why choose DropBees</h2><div class="grid">${[['Save on regular deliveries','Subscription credits make frequent pickups simple.'],['Clear price before you book','See the estimate and credit usage first.'],['Safe handover','A 3-digit delivery OTP confirms the parcel reached the receiver.'],['Local focus','Built for Navi Mumbai, from Airoli to Panvel.']].map(x=>`<div class="card"><h3>${x[0]}</h3><p class="muted">${x[1]}</p></div>`).join('')}</div></div></section>
<section class="sec"><div class="wrap"><div class="card row between"><div><h2>Business delivery solutions</h2><p class="muted">Offices, shops, CAs and retailers: ask for a custom plan.</p></div><a class="btn dark" href="#/business">Register your business</a></div></div></section>
<section class="sec"><div class="wrap narrow"><h2>FAQ</h2>${[['What is the delivery OTP?','It is the last 3 digits of your booking ID. Share it with the receiver. The rider enters it at delivery to confirm the parcel was handed over.'],['Which areas do you serve?','Navi Mumbai for now.'],['How do credits work?','Each booking within your plan limits uses 1 credit. Remaining credits show in your account.'],['Can I cancel a booking?','Yes, while the booking is still in Booking Confirmed status.'],['How do I pay for a subscription?','Send a subscription request. Our team shares payment details and activates the plan after payment.']].map(x=>`<details><summary>${x[0]}</summary><p class="muted">${x[1]}</p></details>`).join('')}</div></section>`;

function render(keep){

function calc(){
 const f=$('#bookForm');if(!f)return;const v=n=>f.elements[n].value,box=$('#est'),btn=$('#sbtn'),pr=CFG.pricing;
 if(v('pa')===''||v('da')===''){box.innerHTML='<span class="muted">Select pickup and drop areas to see your estimate.</span>';btn.disabled=true;return}
 const was=f.elements.useCredit?f.elements.useCredit.checked:true,km=dist(+v('pa'),+v('da')),kg=parseFloat(v('kg'))||0,p=price(km,kg),sub=activeSub();
 let h=`<div class="row between"><span>Distance (approx.)</span><b>${km} km</b></div><div class="row between"><span>Estimated price</span><b>${money(p)}</b></div>`,ok=kg>0;
 if(km>pr.maxKm){h+=`<span class="err">Distance is above our ${pr.maxKm} km limit.</span>`;ok=false}
 if(kg>pr.maxKg){h+=`<span class="err">Weight is above our ${pr.maxKg} kg limit.</span>`;ok=false}
 if(sub&&km<=sub.maxKm&&kg<=sub.maxKg)h+=`<label class="chk"><input type="checkbox" name="useCredit"${was?' checked':''}> <span>Use 1 subscription credit (${sub.credits-sub.used} of ${sub.credits} left). No extra payment.</span></label>`;
 else if(sub)h+=`<span class="muted">Credit cannot be used: your plan covers up to ${sub.maxKm} km and ${sub.maxKg} kg.</span>`;
 else h+=`<span class="muted">No active subscription, so the estimated price applies. <a href="#/plans">See plans</a></span>`;
 if(/medicine/i.test(v('cat')))h+=`<span class="muted">Medicine pickup/drop is allowed only as permitted by applicable laws.</span>`;
 box.innerHTML=h;btn.disabled=!ok;
}

 },
 async book(f){

  if(useCredit)b.update(doc(db,'subscriptions',sub.id),{used:increment(1)});
  const btn=$('#sbtn');btn.disabled=true;
  try{await b.commit();$('#app').innerHTML=`<section class="sec"><div class="wrap narrow"><div class="card"><h2>Booking confirmed</h2><p>Your booking ID</p><p class="price">${code}</p><div class="otp">Delivery OTP <b>${code.slice(-3)}</b><small>Last 3 digits of your booking ID. Share only with the receiver. The rider enters it at delivery.</small></div><p>${useCredit?'1 subscription credit used.':'Estimated price '+money(p)+'. '+esc(CFG.payment.note)}</p><div class="row"><a class="btn" href="#/orders">Track order</a><a class="btn line" href="#/book">Book another</a></div></div></div></section>`;window.scrollTo(0,0)}catch(e){console.error(e);btn.disabled=false;err.textContent='Could not confirm the booking. Please try again.'}
 }
};
const acts={
 bill:b=>{BILL=b.dataset.b;render(true)},
 async sub(b){
  if(!U){location.hash='#/login?next=plans';return}
  if(SUBS.some(s=>s.status==='pending'))return toast('You already have a pending subscription request.');
  const p=CFG.plans.find(x=>x.id===b.dataset.id);if(!p)return;const y=BILL==='yearly';
  try{await addDoc(collection(db,'subscriptions'),{uid:U.uid,userName:PR?.name||'',phone:PR?.phone||'',planId:p.id,planName:p.name,billing:BILL,price:y?p.priceY:p.priceM,credits:y?p.credits*12:p.credits,maxKm:p.maxKm,maxKg:p.maxKg,days:y?365:(p.days||30),status:'pending',used:0,createdAt:serverTimestamp()});toast('Request sent. See your account for payment steps.');location.hash='#/account'}catch(e){console.error(e);toast('Could not send the request. Try again.')}
 },
 useaddr:b=>{const a=(PR?.addresses||{})[b.dataset.k]||{},f=$('#bookForm'),p=b.dataset.to==='p';f.elements[p?'pa':'da'].value=a.area||'';f.elements[p?'pAddr':'dAddr'].value=a.addr||'';calc()},
 async cancel(b){if(!confirm('Cancel this booking? If a subscription credit was used, our team will restore it.'))return;try{await updateDoc(doc(db,'orders',b.dataset.id),{status:'cancelled','times.cancelled':serverTimestamp()});toast('Booking cancelled.')}catch(e){console.error(e);toast('Could not cancel. It may already be in progress.')}},
 async cancelsub(b){if(!confirm('Cancel this subscription?'))return;try{await updateDoc(doc(db,'subscriptions',b.dataset.id),{status:'cancelled'});toast('Subscription cancelled.')}catch(e){console.error(e);toast('Could not cancel. Try again.')}},
 async forgot(){const e=prompt('Enter your account email');if(!e)return;try{await sendPasswordResetEmail(auth,e.trim());toast('If the email exists, a reset link was sent.')}catch(x){toast('Could not send reset email.')}},
 logout:()=>signOut(auth).then(()=>{location.hash='#/'})
};
const app=$('#app');
app.addEventListener('submit',e=>{e.preventDefault();const f=forms[e.target.dataset.form];if(f)f(e.target)});
app.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b){e.preventDefault();acts[b.dataset.act]&&acts[b.dataset.act](b)}});
app.addEventListener('input',e=>{
 if(e.target.closest('#bookForm'))calc();
 if(e.target.id==='q'){const s=e.target.value.trim().toLowerCase();document.querySelectorAll('.oc').forEach(c=>c.hidden=!!s&&!c.dataset.q.includes(s))}
 if(e.target.name==='id')e.target.value=e.target.inputMode==='numeric'?e.target.value.replace(/\D/g,''):e.target.value;
});
app.addEventListener('change',e=>{
 if(e.target.closest('#bookForm'))calc();
 if(e.target.name==='type'){const em=e.target.value==='email',i=e.target.form.elements.id;$('#idl').textContent=em?'Email address':'Phone number (10 digits)';i.value='';i.inputMode=em?'email':'numeric';i.maxLength=em?60:10;i.type=em?'email':'text';const al=$('#altl');if(al)al.textContent=em?'Phone number (optional)':'Email (optional)'}
});

onSnapshot(doc(db,'config','site'),s=>{if(s.exists())CFG=mergeCfg(s.data());refresh()},()=>{});
onAuthStateChanged(auth,u=>{
 un.forEach(f=>f());un=[];U=u;PR=null;ORD=[];SEC={};SUBS=[];READY=true;
 if(u){
  const er=e=>console.error(e),mine=c=>query(collection(db,c),where('uid','==',u.uid));
  un.push(onSnapshot(doc(db,'users',u.uid),s=>{PR=s.exists()?s.data():{name:'',phone:'',email:'',addresses:{}};refresh()},er));
  un.push(onSnapshot(mine('orders'),s=>{ORD=s.docs.map(d=>({id:d.id,...d.data()}));refresh()},er));
  un.push(onSnapshot(mine('secrets'),s=>{SEC={};s.docs.forEach(d=>SEC[d.id]=d.data());refresh()},er));
  un.push(onSnapshot(mine('subscriptions'),s=>{SUBS=s.docs.map(d=>({id:d.id,...d.data()}));refresh()},er));
 }
 render(true);
});
render();
</script>
<script>
(function(){
"use strict";
var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---- Loading screen: shown only during genuine init, min display, hard failsafe ---- */
var loader=document.getElementById('loader');
if(loader){
  var start=performance.now(),MIN=900,MAX=6000,gone=false;
  document.body.style.overflow='hidden';
  var done=function(){
    if(gone)return;gone=true;
    var wait=Math.max(0,MIN-(performance.now()-start));
    setTimeout(function(){
      loader.classList.add('hide');
      document.body.style.overflow='';
      setTimeout(function(){if(loader.parentNode)loader.remove()},700);
    },wait);
  };
  if(document.readyState==='complete'){done();}
  else{window.addEventListener('load',done);}
  setTimeout(done,MAX);
}

/* ---- Section fade-in / slide-up on scroll (added without touching layout) ---- */
if(!reduce&&'IntersectionObserver' in window){
  var io=new IntersectionObserver(function(es){
    es.forEach(function(e){
      if(!e.isIntersecting)return;
      var el=e.target;el.classList.add('in');io.unobserve(el);
      el.addEventListener('transitionend',function h(ev){
        if(ev.propertyName==='opacity'){el.classList.remove('d0','d1','d2');el.removeEventListener('transitionend',h);}
      });
    });
  },{threshold:.1,rootMargin:'0px 0px -6% 0px'});
  var SEL='#app .sec, #app .hgrid > *, #app .card, #app details, #app .otp, #app .est';
  var mark=function(){
    document.querySelectorAll(SEL).forEach(function(el,i){
      if(el.dataset.rv)return;el.dataset.rv='1';
      el.classList.add('reveal','d'+(i%3));
      io.observe(el);
    });
  };
  mark();
  new MutationObserver(mark).observe(document.getElementById('app'),{childList:true});
}
})();
</script>
